# Porta
server.port=${SERVER_PORT:8080}

# CORS
app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Superficies publicas restritas em producao
app.security.docs-public-enabled=false
app.security.h2-console-enabled=false

# Banco de dados (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (producao)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# H2 desabilitado em producao
spring.h2.console.enabled=false

# Swagger desabilitado em producao
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# JWT
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:3600000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
